name: Keep Render Alive - Uptime Robot Gratuit

on:
  schedule:
    - cron: '*/5 * * * *'  # Toutes les 5 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Data Bank Gratuit
        run: |
          echo "Ping https://data-bank-gratuit.onrender.com pour éviter sleep Render Free (15min)..."
          curl -s https://data-bank-gratuit.onrender.com/api/stats || echo "Ping 1 échoué, retry..."
          sleep 5
          curl -s https://data-bank-gratuit.onrender.com/ || echo "Ping 2 échoué"
          echo "✅ Ping OK - Render reste allumé"
          
      - name: Ping alternatives
        run: |
          curl -s https://data-bank-gratuit.onrender.com/api/stats?uptime=robot || true
          echo "UptimeRobot alternative via GitHub Actions - Gratuit, sans carte, sans inscription externe"
