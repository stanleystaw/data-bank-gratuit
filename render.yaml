services:
  - type: web
    name: data-bank-gratuit
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/stats
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
      # Pour persistance, ajoute PostgreSQL gratuit Render (sans carte, 90 jours gratuit)
      # Va sur Render Dashboard > New > PostgreSQL > Free > Copie Internal Database URL
      # Puis ajoute env var DATABASE_URL avec cette URL
      # - key: DATABASE_URL
      #   value: postgres://...

# Pour persistance gratuite sans carte, alternative: Supabase (gratuit sans carte) ou Turso
# Mais Render Free sans DB = SQLite éphémère = Go effacés à chaque deploy

# Solution 1: PostgreSQL gratuit Render (recommandé, sans carte, persistant)
# Va sur https://dashboard.render.com/new/database
# Choisis PostgreSQL, Free, région Oregon, copie Internal Database URL
# Dans ton service data-bank-gratuit, ajoute env var DATABASE_URL = cette URL

# Solution 2: Garde SQLite mais dépose à nouveau après chaque deploy (60,5 Go = 6 clics)
# C'est ce qui vient d'arriver: 60,5 Go effacés car Render Free sans disque persistant
