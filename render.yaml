services:
  # Service principal - Data Bank Gratuit - Sans carte, sans PC, sans MiFi
  - type: web
    name: data-bank-gratuit
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/stats
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PORT
        value: 10000
    # Render free = 750h/mois gratuit, sleep après 15min inactivité, 0F sans carte

  # Alternative: Service avec disque persistant (payant mais garde data)
